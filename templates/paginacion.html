<nav class="mt-3" aria-label="Páginas"><span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }} · {{ pagina.paginator.count }} registros</span>{% if pagina.has_previous %}<a class="ms-3" href="?{% for k,v in request.GET.items %}{% if k != 'page' %}{{ k|urlencode }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ pagina.previous_page_number }}">Anterior</a>{% endif %}{% if pagina.has_next %}<a class="ms-3" href="?{% for k,v in request.GET.items %}{% if k != 'page' %}{{ k|urlencode }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ pagina.next_page_number }}">Siguiente</a>{% endif %}</nav>
